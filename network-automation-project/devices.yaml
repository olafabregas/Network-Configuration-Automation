# Lab inventory for the real SSH/Telnet path (python netauto.py).
# Usernames belong here. Passwords are prompted at runtime and are not stored.
# Demo mode ignores this file and uses a built-in R1/R2 lab instead.
devices:
  - name: R1
    ip: 10.1.12.1
    username: cisco
    device_type: cisco_ios_telnet

  - name: R2
    ip: 10.1.12.2
    username: cisco
    device_type: cisco_ios_telnet

  - name: R3
    ip: 10.1.23.2
    username: cisco
    device_type: cisco_ios_telnet
